# PRs that touch prompts/ or ranking/ run the 20-item extraction subset and the agent smoke tests, and post the
# before/after table as a PR comment. The full suite runs weekly and on demand (evals-full.yml).
name: evals-pr
on:
  pull_request:
    paths: ["prompts/**", "ranking/**", "pipeline/src/quarry_pipeline/rules.py"]
permissions:
  contents: read
  pull-requests: write
jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm }
      - run: npm ci --ignore-scripts && npm rebuild esbuild workerd
      - run: uv sync --frozen
      - name: subset eval (PR head vs base)
        run: |
          uv run python -m quarry_evals.pr_compare --base ${{ github.event.pull_request.base.sha }} --out pr-eval.md
      - name: comment
        uses: actions/github-script@v7
        with:
          script: |
            const body = require('fs').readFileSync('pr-eval.md', 'utf8');
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
