# The site build: fetch bbwatch's public data, update D1, fetch changed policies, extract rules, embed, build
# the static site and deploy. Hourly at :17 (Actions cron can run late or be dropped: freshness is measured).
name: build
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "rebuild even if bbwatch is unchanged"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c413669eec93af689722b3199813448b
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }}
      PIPELINE_LLM_USD_CAP: ${{ vars.PIPELINE_LLM_USD_CAP || '0.50' }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm }
      - run: npm ci --ignore-scripts && npm rebuild esbuild workerd
      - run: uv sync --frozen
      - name: restore policy cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: quarry-cache-${{ github.run_id }}
          restore-keys: quarry-cache-
      - name: build and deploy
        run: uv run quarry-pipeline build ${{ inputs.force && '--force' || '' }}
