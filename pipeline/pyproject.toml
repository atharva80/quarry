[project]
name = "quarry-pipeline"
version = "0.1.0"
description = "Quarry site build: bbwatch state -> D1, policies, rules, embeddings, static site"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "jinja2>=3.1",
  "pydantic>=2.9",
  "numpy>=2.1",
  "beautifulsoup4>=4.12",
  "markdownify>=0.13",
]

[project.scripts]
quarry-pipeline = "quarry_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quarry_pipeline"]
