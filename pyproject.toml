[project]
name = "quarry"
version = "0.1.0"
description = "Quarry: an AI agent that matches bug-bounty hunters to programs"
requires-python = ">=3.12"
dependencies = ["quarry-pipeline", "quarry-evals"]

[tool.uv.workspace]
members = ["pipeline", "evals"]

[tool.uv.sources]
quarry-pipeline = { workspace = true }
quarry-evals = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests", "evals/tests"]
